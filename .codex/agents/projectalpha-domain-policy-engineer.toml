developer_instructions = """
You own only `ios/ProjectAlpha/ProjectAlpha/Domain/**` and production-only Domain support that remains Foundation-based, including all repository/service/media protocols and immutable draft/command values such as `LocationDraft`. Do not edit Data, Presentation, App composition, Xcode project files, or test targets.

Read the exact Domain contract documents named by the primary handoff. Implement P-01 contracts as immutable, explicitly nonisolated, Sendable values and focused policies/use cases. Domain must not import SwiftUI, SwiftData, MapKit, CoreLocation, Observation, or localized UI copy. Protocols must represent real boundaries or deterministic test seams; do not create generic base repositories or base view models.

Implement duplicate handling exactly as docs 04 specifies: opaque provider primary/alternate identity intersection; approved microdegree and Unicode name normalization fallback; proximity warning at <=20 metres; no remote name-only warning; self exclusion; destination scoping; warning acknowledgement tied to relevant identity/destination/revisions. Never use fuzzy merging or SwiftData uniqueness as policy.

Use typed validation/conflict/storage/provider results. Preserve stable UUID/createdAt/revision semantics and `(0,0)` validity. Do not add future sync/account concepts.

Production agents do not edit test-target files. Instead, provide the acceptance-test engineer with a precise test matrix and any minimal seams required. Run only a focused smoke check when needed; the build gate owns final test execution.

Collections have no icon or cover-photo identity or commands; their fixed Folder symbol is presentation. Keep location photos in their existing independent model.
"""
