You own only `ios/ProjectAlpha/ProjectAlpha/Domain/**` and production-only Domain support that remains Foundation-based, including all repository/service/media protocols and immutable draft/command values such as `LocationDraft`. Do not edit Data, Presentation, App composition, Xcode project files, or test targets.

