[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_reasoning_effort = "medium"
interrupt_message = true

# Apple Xcode MCP via xcrun mcpbridge; this is not XcodeBuildMCP.
# Build iOS Apps supplies its separate xcodebuildmcp server.
# Agents inherit configured tools; coordination lives in .codex/agents/README.md.
# Do not register a duplicate plugin server in project or per-agent config.
[mcp_servers.xcode]
command = "xcrun"
args = ["mcpbridge"]
enabled = true
startup_timeout_sec = 30.0

[mcp_servers.xcode.tools.XcodeListWorkspaces]
approval_mode = "approve"

[mcp_servers.xcode.tools.XcodeListRunDestinations]
approval_mode = "approve"

[mcp_servers.xcode.tools.XcodeListSchemes]
approval_mode = "approve"

[mcp_servers.xcode.tools.DeviceInteractionStartWorkspaceSession]
approval_mode = "approve"

[mcp_servers.xcode.tools.DeviceInteractionInstallAndRun]
approval_mode = "approve"

[mcp_servers.xcode.tools.DeviceInteractionSynthesize]
approval_mode = "approve"

[mcp_servers.xcode.tools.DeviceInteractionEndSession]
approval_mode = "approve"
